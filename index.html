<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>樂學寵物島 - 國語學習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
      /* Import Traditional Chinese Rounded Font */
      @import url('https://fonts.googleapis.com/earlyaccess/cwtexyen.css');

      body {
        font-family: 'cwTeXYen', 'Noto Sans TC', sans-serif; /* Use Rounded font primarily */
        background-color: #0f172a; /* slate-900 */
        color: #f1f5f9; /* slate-100 */
        background-image: 
          radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
          radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
          radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
        background-size: 550px 550px, 350px 350px, 250px 250px;
        background-position: 0 0, 40px 60px, 130px 270px;
        min-height: 100vh;
      }

      /* Game-like 3D Button Class */
      .btn-game {
        transition: all 0.1s;
        border-bottom-width: 4px;
      }
      .btn-game:active {
        transform: translateY(2px);
        border-bottom-width: 0px;
        margin-top: 2px;
        margin-bottom: 2px; /* Compensate layout shift */
      }

      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      .pet-float {
        animation: float 3s infinite ease-in-out;
      }

      @keyframes glow {
        0%, 100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        50% { box-shadow: 0 0 30px rgba(59, 130, 246, 0.8), 0 0 10px rgba(255, 255, 255, 0.5); }
      }
      .glow-effect {
        animation: glow 3s infinite;
      }
    </style>
